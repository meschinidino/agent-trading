apiVersion: apps/v1
kind: Deployment
metadata:
  name: onda
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: onda
  template:
    metadata:
      labels:
        app: onda
    spec:
      containers:
        - name: onda
          image: onda
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: onda-config
          env:
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: onda-secrets
                  key: SESSION_SECRET
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: onda-data

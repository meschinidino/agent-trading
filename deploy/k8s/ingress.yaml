# ingress-nginx + cert-manager/Let's Encrypt (HTTP-01).
# SSE: /api/v1/events is a long-lived stream with a 20s heartbeat; the default
# 60s nginx proxy timeout would kill it. 3600s timeouts + buffering off are
# load-bearing — do not remove them.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: onda
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - onda-demo.eastus.cloudapp.azure.com
      secretName: onda-tls
  rules:
    - host: onda-demo.eastus.cloudapp.azure.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: onda
                port:
                  number: 80

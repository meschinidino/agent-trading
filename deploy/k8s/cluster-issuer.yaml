# DRAFT — applied once by hand after cert-manager is installed; not in
# kustomization.yaml because it is cluster-scoped and shared.
# Replace the email before applying (Let's Encrypt expiry notices).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: REPLACE_WITH_OPERATOR_EMAIL
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - http01:
          ingress:
            class: nginx

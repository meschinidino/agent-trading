# Managed Disk (ReadWriteOnce) — NOT Azure Files/SMB.
# The DIN-25/DIN-30 incidents were SQLite lock failures over SMB; a managed disk
# gives the pod local-disk semantics. Single pod only: RWO enforces it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: onda-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: managed-csi
  resources:
    requests:
      storage: 32Gi
